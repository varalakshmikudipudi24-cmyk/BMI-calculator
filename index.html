<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioBalance - BMI Calculator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
            color: white;
            background:
                radial-gradient(circle at top left, #00f2fe55, transparent 35%),
                radial-gradient(circle at bottom right, #4facfe55, transparent 35%),
                linear-gradient(135deg, #09001f, #12002f, #001d35);
        }

        .container {
            width: 100%;
            max-width: 950px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            padding: 25px;
            border: 1px solid rgba(255,255,255,.15);
            border-radius: 30px;
            background: rgba(255,255,255,.08);
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 70px rgba(0,0,0,.45);
        }

        .left, .right {
            padding: 25px;
        }

        .title {
            font-size: 42px;
            font-weight: 800;
            background: linear-gradient(90deg, #00f2fe, #4facfe, #a855f7);
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #b9c4d5;
            margin-bottom: 30px;
        }

        .unit-switch {
            display: flex;
            background: rgba(0,0,0,.25);
            padding: 5px;
            border-radius: 15px;
            margin-bottom: 25px;
        }

        .unit-switch button {
            flex: 1;
            border: none;
            padding: 12px;
            border-radius: 11px;
            color: white;
            background: transparent;
            cursor: pointer;
            transition: .3s;
        }

        .unit-switch button.active {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            box-shadow: 0 5px 20px #0072ff55;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #dce5f3;
            font-size: 14px;
        }

        .input-box {
            position: relative;
        }

        input {
            width: 100%;
            padding: 15px 55px 15px 16px;
            border: 1px solid rgba(255,255,255,.15);
            outline: none;
            border-radius: 14px;
            background: rgba(0,0,0,.25);
            color: white;
            font-size: 17px;
            transition: .3s;
        }

        input:focus {
            border-color: #00d9ff;
            box-shadow: 0 0 20px #00d9ff22;
        }

        .unit {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #8fa4bd;
        }

        .calculate {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            color: white;
            font-size: 17px;
            font-weight: bold;
            background: linear-gradient(135deg, #00d9ff, #7c3aed);
            box-shadow: 0 10px 30px #7c3aed44;
            transition: .3s;
        }

        .calculate:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px #7c3aed66;
        }

        .reset {
            width: 100%;
            margin-top: 10px;
            padding: 12px;
            border: 1px solid rgba(255,255,255,.15);
            border-radius: 13px;
            background: transparent;
            color: #b9c4d5;
            cursor: pointer;
        }

        .right {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .result-title {
            color: #aebbd0;
            font-size: 15px;
            margin-bottom: 10px;
        }

        .bmi-number {
            font-size: 75px;
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(135deg, #fff, #78ddff);
            -webkit-background-clip: text;
            color: transparent;
        }

        .category {
            margin: 15px 0 25px;
            padding: 9px 22px;
            border-radius: 30px;
            background: #00c6ff22;
            border: 1px solid #00c6ff55;
            color: #5ee7ff;
            font-weight: bold;
        }

        /* Gauge */

        .gauge {
            width: 260px;
            height: 130px;
            position: relative;
            overflow: hidden;
            margin: 15px 0 30px;
        }

        .gauge-bg {
            position: absolute;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            background: conic-gradient(
                from 270deg,
                #38bdf8 0deg 55deg,
                #22c55e 55deg 105deg,
                #facc15 105deg 150deg,
                #f97316 150deg 180deg,
                transparent 180deg
            );
        }

        .gauge-inner {
            position: absolute;
            width: 190px;
            height: 190px;
            border-radius: 50%;
            background: #10052a;
            top: 35px;
            left: 35px;
        }

        .needle {
            position: absolute;
            width: 4px;
            height: 100px;
            left: 128px;
            bottom: 0;
            background: white;
            transform-origin: bottom;
            transform: rotate(-90deg);
            border-radius: 5px;
            transition: transform 1s cubic-bezier(.17,.67,.32,1.3);
            box-shadow: 0 0 10px white;
        }

        .gauge-dot {
            position: absolute;
            width: 15px;
            height: 15px;
            background: white;
            border-radius: 50%;
            left: 122px;
            bottom: -3px;
            box-shadow: 0 0 12px white;
        }

        .info {
            width: 100%;
            max-width: 350px;
            padding: 18px;
            border-radius: 18px;
            background: rgba(255,255,255,.06);
            border: 1px solid rgba(255,255,255,.08);
            text-align: center;
        }

        .info h3 {
            margin-bottom: 8px;
            color: #fff;
        }

        .info p {
            color: #aebbd0;
            line-height: 1.5;
            font-size: 14px;
        }

        .footer {
            margin-top: 18px;
            color: #71839a;
            font-size: 11px;
            text-align: center;
        }

        @media(max-width: 750px) {
            .container {
                grid-template-columns: 1fr;
            }

            .title {
                font-size: 34px;
            }

            .right {
                padding-top: 0;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- LEFT SIDE -->
    <div class="left">

        <h1 class="title">BioBalance</h1>

        <p class="subtitle">
            Smart BMI analysis with a futuristic experience.
        </p>

        <div class="unit-switch">
            <button id="metricBtn" class="active" onclick="setUnit('metric')">
                Metric
            </button>

            <button id="imperialBtn" onclick="setUnit('imperial')">
                Imperial
            </button>
        </div>

        <div class="input-group">
            <label>Weight</label>

            <div class="input-box">
                <input
                    type="number"
                    id="weight"
                    placeholder="Enter your weight"
                    min="1"
                >

                <span class="unit" id="weightUnit">kg</span>
            </div>
        </div>

        <div class="input-group">
            <label>Height</label>

            <div class="input-box">
                <input
                    type="number"
                    id="height"
                    placeholder="Enter your height"
                    min="1"
                >

                <span class="unit" id="heightUnit">cm</span>
            </div>
        </div>

        <button class="calculate" onclick="calculateBMI()">
            ✨ Analyze My BMI
        </button>

        <button class="reset" onclick="resetCalculator()">
            ↻ Reset
        </button>

        <div class="footer">
            BMI is a screening measure and does not diagnose health conditions.
        </div>

    </div>


    <!-- RIGHT SIDE -->
    <div class="right">

        <div class="result-title">
            YOUR BODY BALANCE SCORE
        </div>

        <div class="bmi-number" id="bmiValue">
            --
        </div>

        <div class="category" id="category">
            Waiting for analysis
        </div>

        <!-- BMI GAUGE -->
        <div class="gauge">

            <div class="gauge-bg"></div>

            <div class="gauge-inner"></div>

            <div class="needle" id="needle"></div>

            <div class="gauge-dot"></div>

        </div>

        <div class="info">

            <h3 id="message">
                Enter your details
            </h3>

            <p id="description">
                Your personalized BMI information will appear here.
            </p>

        </div>

    </div>

</div>


<script>

    let currentUnit = "metric";


    function setUnit(unit) {

        currentUnit = unit;

        const metricBtn = document.getElementById("metricBtn");
        const imperialBtn = document.getElementById("imperialBtn");

        const weightUnit = document.getElementById("weightUnit");
        const heightUnit = document.getElementById("heightUnit");

        if (unit === "metric") {

            metricBtn.classList.add("active");
            imperialBtn.classList.remove("active");

            weightUnit.innerText = "kg";
            heightUnit.innerText = "cm";

        } else {

            imperialBtn.classList.add("active");
            metricBtn.classList.remove("active");

            weightUnit.innerText = "lb";
            heightUnit.innerText = "in";

        }

        document.getElementById("weight").value = "";
        document.getElementById("height").value = "";

    }


    function calculateBMI() {

        let weight = parseFloat(
            document.getElementById("weight").value
        );

        let height = parseFloat(
            document.getElementById("height").value
        );


        if (!weight || !height || weight <= 0 || height <= 0) {

            alert("Please enter valid height and weight.");

            return;
        }


        let bmi;


        if (currentUnit === "metric") {

            // kg / m²
            let heightMeters = height / 100;

            bmi = weight / (heightMeters * heightMeters);

        } else {

            // Imperial BMI formula
            bmi = (weight / (height * height)) * 703;

        }


        bmi = bmi.toFixed(1);


        document.getElementById("bmiValue").innerText = bmi;


        let category = "";
        let message = "";
        let description = "";
        let color = "";


        if (bmi < 18.5) {

            category = "Underweight";
            message = "Focus on balanced nutrition";
            description =
                "Your BMI is below the standard adult healthy range. Consider discussing nutrition and healthy weight goals with a healthcare professional.";
            color = "#38bdf8";

        }

        else if (bmi < 25) {

            category = "Healthy Range";
            message = "Great balance!";
            description =
                "Your BMI falls within the standard adult healthy range. Continue maintaining balanced nutrition, activity, sleep, and overall wellbeing.";
            color = "#22c55e";

        }

        else if (bmi < 30) {

            category = "Overweight";
            message = "Small changes can help";
            description =
                "Your BMI is above the standard adult healthy range. Regular activity and balanced nutrition may support healthy goals.";
            color = "#facc15";

        }

        else {

            category = "Obesity Range";
            message = "Consider professional guidance";
            description =
                "Your BMI is in the obesity range according to standard adult BMI categories. A healthcare professional can help interpret this in context.";
            color = "#f97316";

        }


        const categoryElement =
            document.getElementById("category");

        categoryElement.innerText = category;

        categoryElement.style.color = color;

        categoryElement.style.borderColor = color + "88";

        categoryElement.style.background = color + "22";


        document.getElementById("message").innerText =
            message;

        document.getElementById("description").innerText =
            description;


        // Animate gauge needle
        let numericBMI = parseFloat(bmi);

        /*
            Map BMI 10–40 to -90° to +90°
        */

        let percentage =
            Math.min(
                Math.max((numericBMI - 10) / 30, 0),
                1
            );

        let rotation =
            -90 + (percentage * 180);


        document.getElementById("needle").style.transform =
            `rotate(${rotation}deg)`;

    }


    function resetCalculator() {

        document.getElementById("weight").value = "";

        document.getElementById("height").value = "";

        document.getElementById("bmiValue").innerText = "--";

        document.getElementById("category").innerText =
            "Waiting for analysis";

        document.getElementById("message").innerText =
            "Enter your details";

        document.getElementById("description").innerText =
            "Your personalized BMI information will appear here.";

        document.getElementById("needle").style.transform =
            "rotate(-90deg)";

    }

</script>

</body>
</html>
